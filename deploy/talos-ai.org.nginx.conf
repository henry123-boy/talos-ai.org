server {
    listen 80;
    listen [::]:80;
    server_name talos-ai.org www.talos-ai.org;

    root /var/www/talos-ai.org;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/talos-ai.org;
    }

    # pages change often: always revalidate. Fonts, scripts and images change rarely: a week in the cache.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    location ~* \.(?:woff2|ttf|js|css|png|svg|ico|webmanifest)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }
}
