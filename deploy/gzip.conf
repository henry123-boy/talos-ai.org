# Installed to /etc/nginx/conf.d/talos-gzip.conf by deploy.sh. Ubuntu's nginx.conf turns gzip on but only for text/html;
# the hero's three.js (690 KB) and the stylesheets need it too. Fonts (woff2) and images are already compressed.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml application/manifest+json;
